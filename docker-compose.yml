version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: resq-backend
    ports:
      - "8000:8000"
    environment:
      - PROJECT_NAME=ResQ
      - ENVIRONMENT=production
      - SECRET_KEY=resq-super-secret-production-jwt-key-2024
      - DATABASE_URL=sqlite+aiosqlite:///./resq.db
      - ACCESS_TOKEN_EXPIRE_MINUTES=1440
    volumes:
      - backend_data:/app
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: resq-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  backend_data:
